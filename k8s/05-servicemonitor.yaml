apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: backend
  namespace: todolist
  labels:
    release: monitoring
spec:
  namespaceSelector:
    matchNames:
      - todolist
  selector:
    matchLabels:
      app: backend
  endpoints:
    - port: http
      path: /metrics
      interval: 15s
