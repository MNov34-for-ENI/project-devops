server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Fallback pour les tests locaux (docker-compose) sans Ingress devant l'app.
    # Sur AKS, l'Ingress route /api directement vers le service backend
    # avant que la requête n'atteigne ce conteneur ; ce bloc n'est alors jamais utilisé.
    location /api/ {
        proxy_pass http://backend:3000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}