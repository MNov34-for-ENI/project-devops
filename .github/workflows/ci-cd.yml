name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write

defaults:
  run:
    working-directory: frontend

jobs:
  backend-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: rootpass
          MYSQL_DATABASE: todolist_db
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -uroot -prootpass"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      DB_HOST: 127.0.0.1
      DB_USER: root
      DB_PASSWORD: rootpass
      DB_NAME: todolist_db
      DB_DIALECT: mysql
      PORT: 3000
    steps:
      # Récupère le code du dépôt
      - uses: actions/checkout@v4

      # Configure Node.js pour l’environnement de test
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      # Installe les dépendances pour le job de test
      - run: npm ci

      # Exécute les tests unitaires et d'intégration (Jest + Supertest)
      - name: Exécuter les tests backend
        run: npm test

  frontend-test:
    runs-on: ubuntu-latest
    steps:
      # Récupère le code du dépôt
      - uses: actions/checkout@v4

      # Configure Node.js pour l’environnement de test
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      # Installe les dépendances pour le job de test
      - run: npm ci

      # Exécute les tests unitaires Angular en mode Chrome headless
      - name: Exécuter les tests unitaires
        run: npx ng test --watch=false --browsers=ChromeHeadless

  frontend-build:
    needs: [frontend-test, backend-test]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      # Récupère le code du dépôt
      - uses: actions/checkout@v4

      # Configure Node.js pour l’environnement de build
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      # Installe les dépendances pour le job de build
      - run: npm ci

      # Génère le fichier environment.prod.ts avec l’URL de l’API en production
      # Le système d'ingress d'AKS permet d'exposer le backend et le frontend via un reverse proxy
      # On définit donc l'URL de l'API comme '/api' pour que les appels soient redirigés vers le backend via l'ingress
      # Adapter apiUrl selon l'host utilisé pour le backend si nécessaire
      - name: Générer environment.prod.ts
        run: |
          cat > src/environments/environment.prod.ts <<EOF
          export const environment = {
            production: true,
            apiUrl: '/api'
          };
          EOF

      # Construit l’application Angular en mode production
      - name: Construire le bundle de production
        run: npx ng build --configuration production

  # NOTE : owner GHCR en dur (revanito) — si vous forkez sous votre propre compte,
  # remplacez "revanito" par votre login GitHub en minuscules dans les deux jobs ci-dessous.
  backend-image:
    needs: backend-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          ssh: default
          tags: |
            ghcr.io/revanito/project-devops-backend:latest
            ghcr.io/revanito/project-devops-backend:${{ github.sha }}

  frontend-image:
    needs: frontend-build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: frontend
          push: true
          ssh: default
          tags: |
            ghcr.io/revanito/project-devops-frontend:latest
            ghcr.io/revanito/project-devops-frontend:${{ github.sha }}

# TODO: déployer les images sur AKS (kubectl apply, mise à jour du tag d'image)
